[package]
name = "win-folder-refresh"
version = "0.1.0"
edition = "2021"
description = "Refresh a Windows folder icon in Explorer via SHChangeNotify (native N-API addon)"
license = "MIT"
repository = "https://github.com/goddivor/win-folder-refresh"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
